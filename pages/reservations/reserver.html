<div class="hero-scene text-center text-white">
    <div class="hero-scene-content">
        <h1>Ma réservation</h1>
    </div>
</div>

<div class="container">
    <form id="reservationForm">
        <div class="mb-3">
            <label for="AllergieInput" class="form-label">Allergies</label>
            <input type="text" class="form-control" id="AllergieInput"
                placeholder="Vos allergies (fruits de mer, arachides...)" name="Allergies">
        </div>
        <div class="mb-3">
            <label for="NbConvivesInput" class="form-label">Nombre de convives</label>
            <input type="number" class="form-control" id="NbConvivesInput" placeholder="Nombre de convives"
                name="NbConvives" min="1" required>
        </div>
        <div class="mb-3">
            <label for="DateInput" class="form-label">Date</label>
            <input type="date" class="form-control" id="DateInput" name="Date" required>
        </div>
        <div class="mb-3">
            <label for="selectHour" class="form-label">Heure</label>
            <select class="form-select" id="selectHour" name="Heure" disabled required>
                <option value="">Choisissez d'abord une date</option>
            </select>
        </div>
        <p id="availabilityMessage" class="text-center"></p>
        <div class="text-center">
            <button type="submit" class="btn btn-primary" id="btnReservation">
                Réserver
            </button>
        </div>
    </form>
</div>
