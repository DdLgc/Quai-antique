<div class="hero-scene text-center text-white">
    <div class=" hero-scene-content">
        <h1>Galerie</h1>
    </div>
</div>

<div class="container">
    <div class="text-center">
        <button type="button" class="btn btn-primary" id="btnAddPicture" data-bs-toggle="modal" data-bs-target="#EditionPhotoModal">Ajouter une photo</button>
    </div>
    <div class="row row-cols-2 row-cols-lg-3 pb-3" id="allImages">
    </div>
    <div class="text-center">
        <a href="/reserver" onclick="route(event)" class="btn btn-primary">Réserver</a>
    </div>
</div>

<!-- Modal edition -->
<div class="modal fade" id="EditionPhotoModal" tabindex="-1" aria-labelledby="EditionPhotoModalLabel"
    aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="EditionPhotoModalLabel">Edition Photo</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="pictureForm">
                    <div class="mb-3">
                        <label for="NamePhotoInput" class="form-label">Titre</label>
                        <input type="text" class="form-control" id="NamePhotoInput"
                            placeholder="Lasagnes à la bolognese">
                    </div>
                    <div class="mb-3">
                        <label for="ImageInput" class="form-label">Image</label>
                        <input type="file" class="form-control" id="ImageInput">
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary" id="btnSavePicture">
                            Enregistrer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<!-- Modal suppression -->
<div class="modal fade" id="DeletePhotoModal" tabindex="-1" aria-labelledby="DeletePhotoModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h2 class="modal-title fs-5" id="DeletePhotoModalLabel">
                    Supprimer cette photo ?
                </h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer">
                </button>
            </div>
            <div class="modal-body">
                <p id="deletePictureTitle"></p>
                <img id="deletePictureImage" src="" class="rounded w-100" alt="">
                <div class="text-center pt-3">
                    <button type="button" class="btn btn-danger" id="btnDeletePicture">
                        Supprimer
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Annuler
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
